name: Bump version y validar

# pull_request SIN filtro de paths A PROPÓSITO: este check es REQUERIDO por la
# branch protection de main — si el workflow no corre (PR de docs/scripts/nativo
# fuera de los paths), el check queda "pendiente" para siempre y el merge se
# bloquea sin salida (cazado en PR #428). El job es barato (~1 min) y pasa solo.
on:
  pull_request:
    branches: [main]
  push:
    paths:
      - 'index.html'
      - 'src/**'
      - 'sw.js'
      - 'version.json'
      - 'validate.py'
      - 'festivals/**.json'
      - 'tests/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Bump version y validar app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar app
        run: python3 validate.py

      - name: Unit tests dominio
        run: node --test tests/unit/*.test.js
