name: Bump version y validar

# pull_request SIN filtro de paths A PROPÓSITO: este check es REQUERIDO por la
# branch protection de main — si el workflow no corre (PR de docs/scripts/nativo
# fuera de los paths), el check queda "pendiente" para siempre y el merge se
# bloquea sin salida (cazado en PR #428). El job es barato (~1 min) y pasa solo.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'sw.js'
      - 'version.json'
      - 'validate.py'
      - 'festivals/**.json'
      - 'tests/**'

# Una sola corrida por PR (18 ago 2026). El workflow disparaba en `push` Y en
# `pull_request`, así que cada rama corría los tests DOS veces en paralelo,
# compitiendo por los mismos runners: de ahí las corridas colgadas de 23 y 96
# minutos que hubo que cancelar a mano. Ahora:
#   · `push` solo en main (el merge) — la rama ya la cubre su PR.
#   · concurrency por PR: un push nuevo cancela la corrida que quedó obsoleta.
# El check REQUERIDO por branch protection viene del evento `pull_request` y no
# se toca: sigue corriendo siempre, sin filtro de paths (lección del PR #428).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Bump version y validar app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD^1 = la base del PR, para saber qué toca

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar app
        # Pillow: sin él, [poster-mirado] emitía «⚠ sin Pillow» EN CADA CORRIDA
        # desde que nació y jamás abrió un póster — y validate-festivals delega
        # en él («si no abre, lo dice poster-mirado»), así que NADIE en ninguna
        # capa verificaba que un póster publicado abra (auditoría 25 ago, lote 3).
        run: |
          pip3 install --quiet pillow
          python3 validate.py

      # La web muestra lo de main aunque el festival no esté en el almacén: un festival
      # nuevo pasa acá el mismo control que en publicar-datos.py. Lee el índice, que es
      # público. Va en este job porque corre siempre, también en un PR de solo datos.
      - name: Sello de función (primera publicación)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD -- festivals src/config.js | grep -q .; then
            python3 pipeline/sello_funcion.py --ci
          else
            echo 'El PR no toca festivals/ ni la config'
          fi

      - name: Unit tests dominio
        run: node --test tests/unit/*.test.js
