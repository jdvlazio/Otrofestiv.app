name: Bump version y validar

# pull_request SIN filtro de paths A PROPÓSITO: este check es REQUERIDO por la
# branch protection de main — si el workflow no corre (PR de docs/scripts/nativo
# fuera de los paths), el check queda "pendiente" para siempre y el merge se
# bloquea sin salida (cazado en PR #428). El job es barato (~1 min) y pasa solo.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'sw.js'
      - 'version.json'
      - 'validate.py'
      - 'festivals/**.json'
      - 'tests/**'

# Una sola corrida por PR (18 ago 2026). El workflow disparaba en `push` Y en
# `pull_request`, así que cada rama corría los tests DOS veces en paralelo,
# compitiendo por los mismos runners: de ahí las corridas colgadas de 23 y 96
# minutos que hubo que cancelar a mano. Ahora:
#   · `push` solo en main (el merge) — la rama ya la cubre su PR.
#   · concurrency por PR: un push nuevo cancela la corrida que quedó obsoleta.
# El check REQUERIDO por branch protection viene del evento `pull_request` y no
# se toca: sigue corriendo siempre, sin filtro de paths (lección del PR #428).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Bump version y validar app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar app
        run: python3 validate.py

      - name: Unit tests dominio
        run: node --test tests/unit/*.test.js
