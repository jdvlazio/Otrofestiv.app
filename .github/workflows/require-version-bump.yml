name: Require version bump

# INTENTO FALLIDO Y REVERTIDO — leer antes de reintentar (23 ago 2026).
#
# El #697 sacó el bump de la rama y lo pasó a un workflow que empujaba a main
# después de mergear. Falló 5 de 5 veces y se revirtió en el #705:
#
#   remote: error: GH006: Protected branch update failed for refs/heads/main.
#   remote: - 4 of 4 required status checks are expected.
#
# La branch protection exige 4 checks para TODO push a main, y esos checks solo
# corren en `pull_request`: un push directo no puede satisfacerlos nunca. Y la
# variante «que el bot abra un PR con auto-merge» tampoco sirve: un PR creado
# con GITHUB_TOKEN NO dispara workflows —GitHub lo impide para evitar recursión—
# así que los checks jamás correrían y el PR quedaría abierto en silencio.
#
# Mientras estuvo roto, #700, #701, CineAutopsia y #702 entraron a main SIN
# bump: las clientes ABIERTAS se quedaron con el JS viejo. El síntoma es
# invisible desde el repo, porque main se ve perfecto.
#
# Automatizarlo de verdad requiere un PAT de admin como secreto. Se descartó:
# es más máquina de la que el problema justifica. El costo que queda —dos PR
# simultáneos chocan en los 4 archivos del bump— es real pero se resuelve en
# dos minutos, y ahora sabemos que casi todo conflicto entre ramas es ese.
#
# Cinturón de seguridad: si un PR cambia app-code (src/, index.html, sw.js) sin
# actualizar version.json, las clientes ACTIVAS no recargan el código nuevo — el
# poll de _checkVersionJson() compara version.json vs BUILD_VERSION y solo dispara
# reload cuando difieren. Sin bump → quedan corriendo JS viejo indefinidamente.
# Este gate lo previene. Rationale: .specify/memory/constitution.md.
#
# Festivals/** NO está acá a propósito: el SW los sirve network-first y se
# re-fetchean en cada load → no dependen del bump para frescura.

on:
  pull_request:
    branches: [main]
    # SIN filtro de paths: check REQUERIDO — sin correr, el PR queda inmergeable
    # (cazado en PR #428). El job pasa solo cuando no hay cambios relevantes.

jobs:
  require-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: App-code change must include a version.json bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Archivos cambiados en el PR:"
          echo "$CHANGED"
          echo "---"
          # festivals/** TAMBIÉN exige bump desde el canal #4 (24 ago 2026): el
          # poll en primer plano solo ve version.json. Un cambio de programación
          # sin bump sería invisible para quien tiene la app abierta — que es
          # exactamente el usuario al que ese cambio le importa. La práctica ya
          # bumpeaba en cada PR de datos (regla 5); el gate ahora lo garantiza.
          APP=$(printf '%s\n' "$CHANGED" | grep -E '^(src/|index\.html$|sw\.js$|festivals/)' || true)
          if [ -z "$APP" ]; then
            echo "✓ Sin cambios de app-code — bump no requerido."
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -qx 'version.json'; then
            echo "✓ App-code cambió y version.json fue actualizado — OK."
            exit 0
          fi
          echo "::error::App-code cambió (src/, index.html o sw.js) sin actualizar version.json. Las clientes activas no recargarán el código nuevo. Corré 'node scripts/bump-version.js' y commiteá el resultado."
          exit 1
