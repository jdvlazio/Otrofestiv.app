name: Validate Festivals

on:
  push:
    branches: [main]
    paths:
      - 'festivals/**.json'
      - 'scripts/validate-festivals.js'
      - 'pipeline/contrato.json'
  pull_request:
    paths:
      - 'festivals/**.json'
      - 'scripts/validate-festivals.js'
      - 'pipeline/contrato.json'

# Una sola corrida por PR (18 ago 2026). El workflow disparaba en `push` Y en
# `pull_request`, así que cada rama corría los tests DOS veces en paralelo,
# compitiendo por los mismos runners: de ahí las corridas colgadas de 23 y 96
# minutos que hubo que cancelar a mano. Ahora:
#   · `push` solo en main (el merge) — la rama ya la cubre su PR.
#   · concurrency por PR: un push nuevo cancela la corrida que quedó obsoleta.
# El check REQUERIDO por branch protection viene del evento `pull_request` y no
# se toca: sigue corriendo siempre, sin filtro de paths (lección del PR #428).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Festival JSON validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation
        run: node scripts/validate-festivals.js

      - name: Report
        if: failure()
        run: |
          echo "::error::Festival JSON validation failed."
          echo "Run 'node scripts/validate-festivals.js' locally to see details."
