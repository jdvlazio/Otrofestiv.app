name: Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'sw.js'
      - 'festivals/**.json'
      - 'tests/**.spec.js'
      - 'tests/helpers.js'
      - 'playwright.config.js'
  # SIN filtro de paths: check REQUERIDO por branch protection — si no corre,
  # el PR queda inmergeable (cazado en PR #428). Costo ~8 min en PRs de docs.
  pull_request:
    branches: [main]

# Una sola corrida por PR (18 ago 2026). El workflow disparaba en `push` Y en
# `pull_request`, así que cada rama corría los tests DOS veces en paralelo,
# compitiendo por los mismos runners: de ahí las corridas colgadas de 23 y 96
# minutos que hubo que cancelar a mano. Ahora:
#   · `push` solo en main (el merge) — la rama ya la cubre su PR.
#   · concurrency por PR: un push nuevo cancela la corrida que quedó obsoleta.
# El check REQUERIDO por branch protection viene del evento `pull_request` y no
# se toca: sigue corriendo siempre, sin filtro de paths (lección del PR #428).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Regression tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache de los BINARIOS de navegador (19 ago 2026). La descarga de chromium
      # + webkit son ~350 MB y el paso se colgó tres veces seguidas —19, 31 y otra
      # vez— bloqueando un merge con el resto del CI en verde. La clave lleva la
      # versión de Playwright del lock: si sube, se descarga de nuevo; si no, se
      # restaura. Los tests son EXACTAMENTE los mismos: esto no relaja el blindaje,
      # solo deja de bajar dos veces lo mismo.
      - name: Versión de Playwright (clave del cache)
        id: pw
        run: echo "v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT

      - name: Cache de navegadores
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers
        # webkit = motor de iOS para el spec responsive cross-engine (proyecto
        # ios-mobile). chromium cubre la suite de comportamiento + el proyecto
        # android-small (Blink@360).
        # Con cache: solo las dependencias del sistema (apt), que NO se cachean.
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi

      # scripts/test.sh en vez de `npx playwright test` directo: cada paso toma un
      # puerto LIBRE para su servidor. Antes los cinco pasos usaban el 3000 y cada
      # uno levantaba y mataba el suyo; si el anterior no había soltado el puerto,
      # el siguiente veía responder a un servidor agonizante y arrancaba sobre él.
      # Misma clase de bug que reventaba dos corridas locales solapadas.
      - name: Smoke tests
        run: ./scripts/test.sh tests/smoke.spec.js

      - name: Regression tests
        run: ./scripts/test.sh tests/programa.spec.js tests/sheet.spec.js tests/planner.spec.js tests/miplan.spec.js tests/festivals.spec.js

      - name: Feature tests
        run: ./scripts/test.sh tests/auth.spec.js tests/search.spec.js tests/i18n.spec.js tests/i18n-boot.spec.js

      # Paso PROPIO, y no sumado a "Regression tests", por lo que mide: un test por
      # FESTIVAL (festivalTestIds) que recorre intereses → prioridades →
      # disponibilidad → Planear → Mi Plan → sugerencias. Cuando cae, lo que falló
      # es un festival concreto, y el nombre del paso lo dice sin abrir el log.
      # Es el gate de docs/FESTIVAL-CHECKLIST.md: un festival nuevo entra solo a la
      # cobertura al agregar su config + su JSON.
      - name: Recorrido por festival
        run: ./scripts/test.sh tests/recorrido-festival.spec.js

      - name: Cross-engine responsive tests
        # Invariantes de layout deterministas bajo WebKit@390 (ios-mobile) +
        # Blink@360 (android-small). El filtro de archivo sólo matchea esos dos
        # proyectos (chromium tiene testIgnore sobre responsive.spec.js); la suite
        # de comportamiento de arriba sigue corriendo SÓLO en chromium@390.
        run: ./scripts/test.sh tests/responsive.spec.js

      - name: Run visual audit
        run: |
          mkdir -p test-results/visual
          mkdir -p test-results/visual
          ./scripts/test.sh tests/visual-audit.spec.js --reporter=list || true

      - name: Upload screenshots (visual audit)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visual-audit-screenshots
          path: test-results/visual/
          retention-days: 14

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results.json
          retention-days: 7
