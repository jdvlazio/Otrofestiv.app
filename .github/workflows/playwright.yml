name: Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'sw.js'
      - 'festivals/**.json'
      - 'tests/**.spec.js'
      - 'tests/helpers.js'
      - 'playwright.config.js'
  # SIN filtro de paths: check REQUERIDO por branch protection — si no corre,
  # el PR queda inmergeable (cazado en PR #428). Costo ~8 min en PRs de docs.
  pull_request:
    branches: [main]

# Una sola corrida por PR (18 ago 2026). El workflow disparaba en `push` Y en
# `pull_request`, así que cada rama corría los tests DOS veces en paralelo,
# compitiendo por los mismos runners: de ahí las corridas colgadas de 23 y 96
# minutos que hubo que cancelar a mano. Ahora:
#   · `push` solo en main (el merge) — la rama ya la cubre su PR.
#   · concurrency por PR: un push nuevo cancela la corrida que quedó obsoleta.
# El check REQUERIDO por branch protection viene del evento `pull_request` y no
# se toca: sigue corriendo siempre, sin filtro de paths (lección del PR #428).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # CAMINO DE DATOS (17–18 oct 2026, decisión de Juan): un PR que solo toca las
  # rutas de .github/camino-datos.txt corre el job «Regression tests (datos)»
  # —smoke, festivales, planificador, Mi Plan y recorrido, los specs que consumen
  # el JSON— y el de la suite completa queda SALTADO (no verde: el check no
  # promete lo que no corrió). En main (push) corre siempre la suite completa.
  clasificar:
    runs-on: ubuntu-latest
    outputs:
      datos: ${{ steps.camino.outputs.datos }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Clasificar el PR
        id: camino
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "datos=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          c=$(node scripts/ci-camino.js "${{ github.base_ref }}")
          [ "$c" = "datos" ] && echo "datos=true" >> "$GITHUB_OUTPUT" || echo "datos=false" >> "$GITHUB_OUTPUT"

  # Camino de datos, en 3 máquinas a la vez (20 oct 2026, aprobado por Juan).
  # Corría en UNA: ~19 min por PR de datos, 15 solo en festivales + planificador
  # + Mi Plan, de a un test. Mismos specs, repartidos con --shard (como la suite
  # completa de abajo). El check requerido sigue llamándose «Regression tests
  # (datos)»: lo da el job que junta las 3 partes.
  datos-shard:
    needs: clasificar
    if: needs.clasificar.outputs.datos == 'true'
    runs-on: ubuntu-latest
    name: Regression tests datos (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Smoke, festivales, planificador, Mi Plan y recorrido (parte ${{ matrix.shard }} de 3)
        run: ./scripts/test.sh tests/smoke.spec.js tests/festivals.spec.js tests/planner.spec.js tests/miplan.spec.js tests/recorrido-festival.spec.js --shard=${{ matrix.shard }}/3 --fully-parallel
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-datos-${{ matrix.shard }}
          path: |
            playwright-report*/
            test-results*.json
          retention-days: 7

  datos:
    needs: [clasificar, datos-shard]
    if: always() && (needs.clasificar.outputs.datos == 'true')
    runs-on: ubuntu-latest
    name: Regression tests (datos)
    steps:
      - name: Las 3 partes pasaron
        run: |
          r="${{ needs.datos-shard.result }}"
          echo "partes: $r"
          [ "$r" = "success" ] || { echo "::error::alguna parte del camino de datos falló ($r)"; exit 1; }

  # Suite completa, en 4 máquinas a la vez (18 oct 2026). Antes corría una lista
  # escrita a mano de 14 archivos, en UNA máquina y de a un test: 16 de 30 specs
  # (boleta, cuentas, reportes, títulos, avisos, offline…) NUNCA corrían en CI.
  # Ahora corre TODO tests/*.spec.js (salvo la auditoría visual, que va aparte en
  # main), repartido con --shard. El check requerido sigue llamándose
  # «Regression tests»: lo da el job de abajo, que junta los 4.
  test-shard:
    needs: clasificar
    if: needs.clasificar.outputs.datos != 'true'
    runs-on: ubuntu-latest
    name: Regression tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verificar navegadores de la imagen
        run: |
          npx playwright --version
          test -d "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}" || { echo "::error::la imagen no trae los navegadores"; exit 1; }
      - name: Tests (parte ${{ matrix.shard }} de 4)
        run: ./scripts/test.sh $(ls tests/*.spec.js | grep -v visual-audit) --shard=${{ matrix.shard }}/4
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report*/
            test-results*.json
          retention-days: 7

  test:
    needs: [clasificar, test-shard]
    if: always() && needs.clasificar.outputs.datos != 'true'
    runs-on: ubuntu-latest
    name: Regression tests
    steps:
      - name: Las 4 partes pasaron
        run: |
          r="${{ needs.test-shard.result }}"
          echo "partes: $r"
          [ "$r" = "success" ] || { echo "::error::alguna parte de la suite falló ($r)"; exit 1; }

  visual:
    needs: clasificar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Auditoría visual
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run visual audit
        run: |
          mkdir -p test-results/visual
          ./scripts/test.sh tests/visual-audit.spec.js --reporter=list
      - name: Upload screenshots (visual audit)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visual-audit-screenshots
          path: test-results/visual/
          retention-days: 14
