name: Frontera código/datos

# «Código de la app acá, datos del festival allá». La regla existía como acuerdo
# entre los dos chats de trabajo; acá se vuelve ejecutable.
#
# POR QUÉ: el 8 ago 2026 un PR de festival arrastró un symlink al raíz del repo y
# tumbó el deploy de Pages — FICMA quedó en main sin llegar a producción. Los PR
# mezclados son también los que producen los conflictos caros: dos ramas vivas
# tocando los mismos archivos de app.
#
# NO es un bloqueo dogmático: `src/config.js` está excluido a propósito, porque
# registrar un festival en FESTIVAL_CONFIG es parte legítima de un PR de datos.
# Y si un cambio necesita de verdad los dos lados, la etiqueta `frontera-ok` lo
# deja pasar dejando rastro de que fue una decisión, no un descuido.

on:
  pull_request:
    branches: [main]
    # SIN filtro de paths, por la misma razón que los otros checks: si el workflow
    # no corre, un check requerido queda pendiente para siempre (PR #428).
    #
    # `labeled`/`unlabeled` NO son un adorno. `frontera-ok` se lee del payload del
    # evento, y con los tipos por defecto —opened, synchronize, reopened— poner la
    # etiqueta no vuelve a disparar nada: el check se queda rojo con la etiqueta
    # puesta, y un re-run repite el payload viejo. Es decir, el mensaje de error
    # mandaba a hacer algo que no tenía efecto, y la única salida era un push
    # vacío. Pasó en el PR #684 (CineAutopsia). `unlabeled` va por simetría: si
    # se quita la etiqueta, el check tiene que volver a opinar.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  frontera:
    runs-on: ubuntu-latest
    name: Frontera código/datos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Un PR toca código o toca datos, no las dos cosas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ETIQUETADO: ${{ contains(github.event.pull_request.labels.*.name, 'frontera-ok') }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Archivos cambiados:"; echo "$CHANGED"; echo "---"

          # Código: la app. src/config.js NO cuenta — es donde se registra un festival.
          CAND=$(printf '%s\n' "$CHANGED" | grep -E '^(src/|index\.html$|sw\.js$|validate\.py$|tests/|scripts/)' \
                | grep -vx 'src/config.js' || true)

          # …ni cuenta el CHURN DEL BUMP DE VERSIÓN. `scripts/bump-version.js` reescribe
          # la cadena de build en index.html, sw.js y src/main.js, y publicar EXIGE el
          # bump — así que sin este filtro el guardián se disparaba en TODO PR de
          # festival y pedía la etiqueta cada vez. Medido en el PR #703: los tres
          # archivos tenían CERO líneas cambiadas que no fueran la versión.
          # Los patrones son los cinco que escribe el script, con sus 12 dígitos; un
          # archivo solo se descarta si TODAS sus líneas cambiadas son de esa forma,
          # así que un cambio real en el mismo archivo sigue contando.
          BUMP='(otrofestiv-v[0-9]{12}|BUILD = .[0-9]{12}.|BUILD_VERSION=.[0-9]{12}.|main\.js\?v=[0-9]{12}|favicon(-192)?\.png\?v=[0-9]{12})'
          COD=''
          for f in $CAND; do
            REAL=$(git diff "$BASE_SHA...$HEAD_SHA" -- "$f" \
                   | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                   | grep -vE "$BUMP" || true)
            if [ -n "$REAL" ]; then
              COD="$COD$f"$'\n'
            else
              echo "· $f: solo bump de versión, no cuenta como código"
            fi
          done
          COD=$(printf '%s' "$COD" | sed '/^$/d')
          # Datos: el material de un festival.
          DAT=$(printf '%s\n' "$CHANGED" | grep -E '^(festivals/|assets/)' || true)

          if [ -z "$COD" ] || [ -z "$DAT" ]; then
            echo "✓ El PR se queda de un solo lado de la frontera."
            exit 0
          fi

          echo "Código:"; printf '%s\n' "$COD" | sed 's/^/    /'
          echo "Datos:";  printf '%s\n' "$DAT" | sed 's/^/    /'

          if [ "$ETIQUETADO" = "true" ]; then
            echo "⚠ Mezcla código+datos, permitida por la etiqueta 'frontera-ok'."
            exit 0
          fi

          echo "::error::Este PR mezcla código de la app con datos de festival. Separalos en dos PR (primero el de app, para que el dato nunca llegue a producción antes del código que sabe leerlo). Si la mezcla es deliberada, etiquetá el PR como 'frontera-ok'."
          exit 1
