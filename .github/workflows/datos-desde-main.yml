# datos-desde-main — el almacén `datos` nunca queda atrás de main (18 oct 2026).
# La app lee los festivales del almacén (migración 0009). Si un festival cambia
# por el camino de siempre (PR → main), este job lo republica al almacén. Los
# guardianes ya corrieron en el PR (CI requerido), así que acá se publica tal cual.
# Republica lo que ya está en el almacén y da de ALTA (25 nov 2026) el festival visible y
# sin terminar que falta: el acto a propósito es el merge que lo hace visible. Nunca de
# golpe (Juan, 18 oct 2026): más de dos a la vez no entra ninguno y el job queda en rojo.
name: Datos al almacén
on:
  push:
    branches: [main]
    paths:
      - 'festivals/*.json'
      - 'festivals/staging/*-sellos-funcion.json'   # un alta frenada se retoma al llegar lo que faltaba
      - 'festivals/staging/*-acceso.json'
      - 'festivals/staging/*-fuentes.json'
      - 'src/config.js'      # la FICHA de cada festival (Etapa 2·B1)
      - 'assets/keyart/**'
  workflow_dispatch:         # ponerlo al día a mano, sin otro merge
permissions:
  contents: write   # empujar la rama `datos`
concurrency:
  group: datos-almacen
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # La punta de main, no el commit del evento: repetir un run viejo no publica
      # datos viejos. Con la historia (sin blobs) para saber cuándo tocó main cada festival.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      # La ficha se lee importando src/config.js: Node fijado (la detección de
      # módulos ES de un .js sin "type" llegó en Node 22).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Publicar al almacén
        env:
          OTF_POR: github-actions
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          python3 pipeline/almacen_al_dia.py
